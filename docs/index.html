<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>펨코 핫딜 필터</title>
<meta name="description" content="에펨코리아 핫딜을 이전 가격과 비교해 걸러 보는 미니 앱" />
<meta name="theme-color" content="#0f1115" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root{
    --bg:#0f1115; --bg2:#151922; --card:#1a1f2a; --card2:#202736;
    --line:#2a3140; --txt:#e8ecf3; --dim:#98a2b3; --dim2:#6b7686;
    --green:#2fd07f; --green-bg:rgba(47,208,127,.12);
    --red:#ff7a7a; --red-bg:rgba(255,122,122,.10);
    --accent:#5b8cff; --accent-bg:rgba(91,140,255,.14);
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    font-size:15px;line-height:1.45;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;
  }
  button{font-family:inherit}

  /* ── 헤더 ───────────────────────────── */
  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,#0f1115 78%,rgba(15,17,21,.85));
    backdrop-filter:blur(10px);
    padding:calc(10px + env(safe-area-inset-top)) 16px 8px;
    border-bottom:1px solid var(--line);
  }
  .top{display:flex;align-items:center;gap:8px}
  .logo{font-size:17px;font-weight:800;letter-spacing:-.3px}
  .logo span{color:var(--green)}
  .spacer{flex:1}
  .ghost{
    background:var(--card);border:1px solid var(--line);color:var(--dim);
    border-radius:10px;padding:7px 10px;font-size:12px;font-weight:600;
  }
  .ghost:active{background:var(--card2)}
  .sub{display:flex;align-items:center;gap:6px;margin:6px 0 10px;color:var(--dim2);font-size:11.5px}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--green);flex:none}

  .search{position:relative;margin-bottom:8px}
  .search input{
    width:100%;padding:11px 34px 11px 12px;border-radius:12px;
    background:var(--bg2);border:1px solid var(--line);color:var(--txt);font-size:14px;
  }
  .search input::placeholder{color:var(--dim2)}
  .search input:focus{outline:none;border-color:var(--accent)}
  .search .clr{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:24px;height:24px;border:0;border-radius:50%;background:var(--card2);
    color:var(--dim);font-size:13px;line-height:1;display:none;
  }
  .search.has .clr{display:block}

  .exclude{margin-bottom:10px}
  .exclude input{
    width:100%;padding:9px 12px;border-radius:12px;background:transparent;
    border:1px dashed var(--line);color:var(--txt);font-size:13px;
  }
  .exclude input::placeholder{color:var(--dim2)}
  .exclude input:focus{outline:none;border-color:var(--accent)}

  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:7px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--bg2);color:var(--dim);font-size:13px;font-weight:600;white-space:nowrap;
  }
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .toggles{display:flex;gap:8px;padding:2px 0 10px}
  .toggle{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 8px;border-radius:12px;border:1px solid var(--line);
    background:var(--bg2);color:var(--dim);font-size:12.5px;font-weight:600;
  }
  .toggle.on{background:var(--green-bg);border-color:rgba(47,208,127,.45);color:var(--green)}
  .toggle .mark{
    width:16px;height:16px;border-radius:5px;border:1.5px solid currentColor;
    display:grid;place-items:center;font-size:11px;flex:none;
  }
  .toggle.on .mark::after{content:"✓"}

  .seg{flex:1;min-width:0;display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
  .seg button{
    flex:1;border:0;background:transparent;color:var(--dim);font-size:12.5px;font-weight:700;
    padding:7px 0;border-radius:9px;white-space:nowrap;
  }
  .seg button.on{background:var(--card2);color:var(--txt)}
  .segwrap{display:flex;align-items:center;gap:8px;padding-bottom:9px}
  .seglabel{font-size:11.5px;color:var(--dim2);flex:none;padding-left:2px}

  /* ── 목록 ────────────────────────────── */
  main{padding:12px 12px 0}
  .resultbar{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px;color:var(--dim2);font-size:12px}
  .resultbar b{color:var(--txt);font-size:13px}
  .reset{background:none;border:0;color:var(--accent);font-size:12px;font-weight:700}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:9px;overflow:hidden;
  }
  .card.open{border-color:#3a4a66}
  .row{padding:13px 14px;display:block;width:100%;text-align:left;background:none;border:0;color:inherit}
  .row:active{background:var(--card2)}
  .tline{display:flex;gap:6px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
  .mall{font-size:11px;font-weight:800;color:#fff;background:#33405a;padding:2px 7px;border-radius:6px;letter-spacing:-.2px}
  .cat{font-size:11px;color:var(--dim);border:1px solid var(--line);padding:1.5px 6px;border-radius:6px}
  .ended{font-size:11px;font-weight:800;color:var(--red);background:var(--red-bg);padding:2px 6px;border-radius:6px}
  .title{font-size:15px;font-weight:700;letter-spacing:-.3px;line-height:1.35;margin:0 0 8px;word-break:keep-all}
  .priceline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .price{font-size:17px;font-weight:800;letter-spacing:-.4px}
  .ship{font-size:12px;color:var(--dim)}
  .meta{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--dim2)}
  .meta .up{color:#ffc861;font-weight:700}
  .badge{
    margin-top:9px;display:inline-flex;align-items:center;gap:5px;
    font-size:12.5px;font-weight:800;padding:5px 9px;border-radius:9px;
    background:var(--green-bg);color:var(--green);
  }
  .badge.expensive{background:var(--red-bg);color:var(--red)}
  .badge.none{background:var(--card2);color:var(--dim)}
  .badge small{font-weight:600;opacity:.8;font-size:11px}

  /* 펼침 */
  .detail{display:none;border-top:1px solid var(--line);padding:12px 14px 14px;background:var(--bg2)}
  .card.open .detail{display:block}
  .dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .dhead b{font-size:12.5px}
  .dhead span{font-size:11px;color:var(--dim2)}
  .cmp{display:flex;flex-direction:column;gap:7px}
  .cmprow{
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;
  }
  .cmpname{font-size:12.5px;color:var(--txt);line-height:1.35;margin-bottom:3px}
  .cmpmeta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim2);flex-wrap:wrap}
  .cmpmeta b{color:var(--dim);font-weight:700}
  .diff{font-weight:800;font-size:11.5px}
  .diff.up{color:var(--green)}
  .diff.down{color:var(--red)}
  .none-box{font-size:12px;color:var(--dim2);padding:8px 2px}
  .hint{font-size:11.5px;color:var(--dim2);padding:9px 2px 0;line-height:1.5}
  .actions{display:flex;gap:8px;margin-top:12px}
  .actions a{
    flex:1;text-align:center;text-decoration:none;padding:11px 8px;border-radius:11px;
    font-size:13px;font-weight:800;
  }
  .actions .primary{background:var(--accent);color:#fff}
  .actions .secondary{background:var(--card);border:1px solid var(--line);color:var(--txt)}
  .actions a.disabled{opacity:.4;pointer-events:none}

  .empty{padding:60px 20px;text-align:center;color:var(--dim2);font-size:13.5px;line-height:1.7}
  .empty b{display:block;color:var(--dim);font-size:15px;margin-bottom:6px}
  footer{padding:22px 16px 10px;color:var(--dim2);font-size:11px;text-align:center;line-height:1.6}
  .skeleton{height:104px;border-radius:var(--radius);background:linear-gradient(90deg,#1a1f2a,#222a38,#1a1f2a);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:9px}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="logo">펨코 <span>핫딜</span> 필터</div>
    <div class="spacer"></div>
    <button class="ghost" id="reload">↻ 새로고침</button>
  </div>
  <div class="sub"><i class="dot"></i><span id="stamp">불러오는 중…</span></div>

  <div class="search" id="searchWrap">
    <input id="q" type="search" placeholder="검색어 (상품·쇼핑몰)" autocomplete="off" enterkeyhint="search" />
    <button class="clr" id="qClear" aria-label="검색어 지우기">✕</button>
  </div>
  <div class="exclude">
    <input id="ex" type="text" placeholder="제외 키워드 (쉼표로 구분)  예: 중고, 리퍼, 반품" autocomplete="off" />
  </div>

  <div class="chips" id="chips"></div>

  <div class="segwrap">
    <span class="seglabel">추천</span>
    <div class="seg" id="votes">
      <button data-v="0" class="on">전체</button>
      <button data-v="3">3+</button>
      <button data-v="5">5+</button>
      <button data-v="10">10+</button>
    </div>
  </div>

  <div class="toggles">
    <button class="toggle" id="tCheaper"><i class="mark"></i>이전보다 싼 것만</button>
    <button class="toggle on" id="tEnded"><i class="mark"></i>종료된 딜 숨김</button>
  </div>
</header>

<main>
  <div class="resultbar">
    <span><b id="count">0</b>건 <span id="of"></span></span>
    <button class="reset" id="reset">필터 초기화</button>
  </div>
  <div id="list">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</main>

<footer>
  데이터: 에펨코리아 핫딜 · GitHub Actions로 30분마다 갱신<br />
  가격 비교는 각 글의 “유사한 최근 6개월 핫딜들” 기준입니다.
</footer>

<script>
const state = {
  deals: [],
  meta: null,
  q: '',
  ex: '',
  cat: '전체',
  minVotes: 0,
  cheaperOnly: false,
  hideEnded: true,
};
const $ = (s) => document.querySelector(s);
const nf = (n) => (n == null ? '-' : n.toLocaleString('ko-KR'));

function ago(iso) {
  if (!iso) return '시각 정보 없음';
  const t = new Date(iso).getTime();
  if (Number.isNaN(t)) return iso;
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return '방금';
  if (m < 60) return m + '분 전';
  const h = Math.round(m / 60);
  if (h < 24) return h + '시간 전';
  return new Date(iso).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' });
}

function saveState() {
  try {
    localStorage.setItem('fmk-filters', JSON.stringify({
      q: state.q, ex: state.ex, cat: state.cat, minVotes: state.minVotes,
      cheaperOnly: state.cheaperOnly, hideEnded: state.hideEnded,
    }));
  } catch {}
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('fmk-filters') || '{}');
    Object.assign(state, s);
  } catch {}
}

function categories(deals) {
  const seen = [];
  for (const d of deals) if (d.category && !seen.includes(d.category)) seen.push(d.category);
  return ['전체', ...seen];
}

function renderChips() {
  const cats = categories(state.deals);
  $('#chips').innerHTML = cats.map((c) =>
    `<button class="chip${state.cat === c ? ' on' : ''}" data-cat="${c}">${c}</button>`
  ).join('');
}

function match(d) {
  if (state.cat !== '전체' && d.category !== state.cat) return false;
  if (state.minVotes > 0 && (d.upvotes || 0) < state.minVotes) return false;
  if (state.cheaperOnly && d.is_cheaper !== true) return false;
  if (state.hideEnded && d.is_ended) return false;
  const hay = `${d.title} ${d.mall || ''} ${d.category || ''}`.toLowerCase();
  if (state.q && !hay.includes(state.q.toLowerCase())) return false;
  if (state.ex) {
    const words = state.ex.split(/[,\n]/).map((w) => w.trim().toLowerCase()).filter(Boolean);
    if (words.some((w) => hay.includes(w))) return false;
  }
  return true;
}

function badge(d) {
  if (d.is_cheaper === true && d.best_savings_krw) {
    return `<div class="badge">이전보다 ${nf(d.best_savings_krw)}원 저렴 <small>최근 6개월</small></div>`;
  }
  if (d.is_cheaper === false) {
    const worst = d.comparisons
      .filter((c) => c.is_cheaper === false && c.savings_krw)
      .sort((a, b) => a.savings_krw - b.savings_krw)[0];
    return `<div class="badge expensive">이전 핫딜이 ${nf(Math.abs(worst ? worst.savings_krw : 0))}원 더 저렴</div>`;
  }
  if (d.has_comparisons) return `<div class="badge none">비교 문구 없음</div>`;
  return '';
}

function card(d, idx) {
  const price = d.price || '가격 미표기';
  const cmpRows = (d.comparisons || []).map((c) => {
    const diffClass = c.is_cheaper === true ? 'up' : c.is_cheaper === false ? 'down' : '';
    const diff = c.diff_text
      ? `<span class="diff ${diffClass}">${c.diff_text}</span>`
      : '';
    return `<div class="cmprow">
      <div class="cmpname">${esc(c.name)}</div>
      <div class="cmpmeta"><b>${esc(c.price || '가격 미표기')}</b>${diff}<span>${c.posted_at || ''}</span></div>
    </div>`;
  }).join('');

  const hint = priceHint(d);
  const cmpBlock = d.has_comparisons
    ? `<div class="cmp">${cmpRows}</div>`
    : `<div class="none-box">이 글에는 아직 비교 데이터가 없습니다. (수집 시 상세 페이지를 읽지 못한 글)</div>`;

  return `<article class="card" data-idx="${idx}">
    <button class="row" aria-expanded="false">
      <div class="tline">
        ${d.mall ? `<span class="mall">${esc(d.mall)}</span>` : ''}
        ${d.category ? `<span class="cat">${esc(d.category)}</span>` : ''}
        ${d.is_ended ? `<span class="ended">종료 신고 ${d.ended_reports || 1}</span>` : ''}
      </div>
      <h2 class="title">${esc(d.title)}</h2>
      <div class="priceline">
        <span class="price">${esc(price)}</span>
        <span class="ship">${d.shipping ? '배송 ' + esc(d.shipping) : ''}</span>
      </div>
      <div class="meta">
        <span class="up">▲ ${d.upvotes == null ? 0 : d.upvotes}</span>
        <span>💬 ${d.comments == null ? 0 : d.comments}</span>
        <span>${ago(d.posted_at)}</span>
      </div>
      ${badge(d)}
    </button>
    <div class="detail">
      <div class="dhead">
        <b>최근 6개월 유사 핫딜</b>
        <span>${d.comparison_total ? '총 ' + nf(d.comparison_total) + '건 중 ' + d.comparisons.length + '건 표시' : '비교 목록 없음'}</span>
      </div>
      ${cmpBlock}
      ${hint ? `<div class="hint">${hint}</div>` : ''}
      <div class="actions">
        <a class="primary${d.shop_url ? '' : ' disabled'}" href="${d.shop_url || '#'}" target="_blank" rel="noopener noreferrer">쇼핑몰 바로가기</a>
        <a class="secondary" href="${d.url}" target="_blank" rel="noopener noreferrer">펨코 원문 보기</a>
      </div>
    </div>
  </article>`;
}

/* 사이트가 “더 저렴/더 비쌈” 문구를 주지 않은 글은,
   비교 목록에 적힌 가격끼리만 계산해 참고 문장을 만든다. (추정이 아니라 단순 비교) */
function priceHint(d) {
  if (!d.has_comparisons || d.is_cheaper === true || d.is_cheaper === false) return '';
  if (d.price_krw == null) return '';
  const prices = (d.comparisons || []).map((c) => c.price_krw).filter((v) => typeof v === 'number');
  if (!prices.length) return '';
  const min = Math.min(...prices);
  const diff = min - d.price_krw;
  if (diff > 0) return `비교 목록 최저 표기(${nf(min)}원)보다 ${nf(diff)}원 낮게 올라온 글`;
  if (diff === 0) return `비교 목록 최저 표기와 같은 가격(${nf(min)}원)`;
  return `비교 목록 최저 표기(${nf(min)}원)보다 ${nf(-diff)}원 높은 가격`;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (m) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
  ));
}

function render() {
  const list = state.deals.filter(match);
  $('#count').textContent = list.length;
  $('#of').textContent = `/ 전체 ${state.deals.length}건`;
  if (!list.length) {
    $('#list').innerHTML = `<div class="empty"><b>조건에 맞는 딜이 없습니다</b>필터를 조금 풀어보세요.<br />‘이전보다 싼 것만’을 끄면 전체 ${state.deals.length}건을 볼 수 있습니다.</div>`;
    return;
  }
  $('#list').innerHTML = list.map(card).join('');
}

function syncUI() {
  $('#q').value = state.q;
  $('#ex').value = state.ex;
  $('#searchWrap').classList.toggle('has', !!state.q);
  [...$('#votes').children].forEach((b) => b.classList.toggle('on', Number(b.dataset.v) === state.minVotes));
  $('#tCheaper').classList.toggle('on', state.cheaperOnly);
  $('#tEnded').classList.toggle('on', state.hideEnded);
  renderChips();
}

/* 이벤트 */
$('#q').addEventListener('input', (e) => { state.q = e.target.value; saveState(); $('#searchWrap').classList.toggle('has', !!state.q); render(); });
$('#qClear').addEventListener('click', () => { state.q = ''; saveState(); syncUI(); render(); });
$('#ex').addEventListener('input', (e) => { state.ex = e.target.value; saveState(); render(); });
$('#chips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  state.cat = b.dataset.cat; saveState(); syncUI(); render();
});
$('#votes').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.minVotes = Number(b.dataset.v); saveState(); syncUI(); render();
});
$('#tCheaper').addEventListener('click', () => { state.cheaperOnly = !state.cheaperOnly; saveState(); syncUI(); render(); });
$('#tEnded').addEventListener('click', () => { state.hideEnded = !state.hideEnded; saveState(); syncUI(); render(); });
$('#reset').addEventListener('click', () => {
  state.q = ''; state.ex = ''; state.cat = '전체'; state.minVotes = 0;
  state.cheaperOnly = false; state.hideEnded = true;
  saveState(); syncUI(); render();
});
$('#list').addEventListener('click', (e) => {
  const row = e.target.closest('.row'); if (!row) return;
  const card = row.closest('.card');
  const open = card.classList.toggle('open');
  row.setAttribute('aria-expanded', String(open));
});
$('#reload').addEventListener('click', () => load(true));

async function load(force) {
  try {
    const url = './data/deals.json' + (force ? '?t=' + Date.now() : '');
    const res = await fetch(url, { cache: force ? 'reload' : 'default' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    state.deals = data.deals || [];
    state.meta = data;
    const when = data.generated_at ? new Date(data.generated_at) : null;
    $('#stamp').textContent = when
      ? `${when.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })} 수집 · ${state.deals.length}건`
      : `${state.deals.length}건`;
    syncUI();
    render();
  } catch (err) {
    $('#list').innerHTML = `<div class="empty"><b>데이터를 불러오지 못했습니다</b>${esc(err.message)}<br />잠시 후 ‘새로고침’을 눌러보세요.</div>`;
    $('#stamp').textContent = '불러오기 실패';
  }
}

loadState();
syncUI();
load(false);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
